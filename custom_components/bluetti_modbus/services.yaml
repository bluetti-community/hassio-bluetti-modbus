read_register:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bluetti_modbus
    address:
      required: true
      example: 57016
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
