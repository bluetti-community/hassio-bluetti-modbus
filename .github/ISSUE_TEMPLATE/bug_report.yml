name: Bug report
description: Report a problem with the Bluetti Modbus integration
title: "[Bug] <Replace this part>"
labels:
  - bug
body:
  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: >
        Please search the open and closed issues before filing a new one - many reports turn out
        to share the same root cause.
      options:
        - label: I searched and didn't find an existing issue for this problem
          required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Version
      description: Settings -> About
      placeholder: 2026.8.2
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Bluetti Modbus Integration Version
      description: HACS -> Bluetti Modbus, or check manifest.json's "version" field
      placeholder: 0.0.29
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: What device are you using?
      description: See the README's Supported devices section for the full list.
      options:
        - Balco 260
        - S Meter
        - EP2000
        - AC500
        - Other / not listed
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what's wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs (if the issue is a crash or connection error)
      description: >
        Settings -> System -> Logs, filtered to "Bluetti Modbus" - or the Details view of the
        specific error notification. Please paste the full traceback, not just the summary line.
      render: text
  - type: textarea
    id: modread
    attributes:
      label: bluetti-modread output (if the issue is about missing/wrong sensor values)
      description: >
        Run `bluetti-modread -c <device-ip> -p 502 -t <balco260|smeter|ep2000|ac500>` against
        your device directly (see the bluetti-modbus README) and paste the output. This shows
        exactly what your device reports over Modbus, independent of Home Assistant, which is
        usually the fastest way to tell a decoding bug from a device-side quirk.
      render: text
